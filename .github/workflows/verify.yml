name: verify-distribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required distribution files
        run: |
          set -euo pipefail
          for f in index.html filmcraft_web.js filmcraft_web_bg.wasm audio-worklet.js \
                   favicon.png README.md AGENTS.md llms.txt agent/manifest.json; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          grep -q 'filmcraft_web_bg.wasm' index.html
          grep -q 'application/wasm' _headers

      - name: Checksums
        run: sha256sum -c SHA256SUMS.txt

      - name: No application source in the public distribution
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.rs' -o -name 'Cargo.toml' -o -name '*.ts' -o -name '*.tsx' \) | grep -q .; then
            echo 'Application source files are present in the public distribution.'
            find . -type f \( -name '*.rs' -o -name 'Cargo.toml' -o -name '*.ts' -o -name '*.tsx' \)
            exit 1
          fi

      - name: Manifest is valid JSON
        run: |
          python3 - <<'PY'
          import json
          for path in ('agent/manifest.json',):
              with open(path, encoding='utf-8') as handle:
                  data = json.load(handle)
              assert data['name'] == 'filmcraft-web'
              assert data['commands'] > 0
              assert data['api']['global'] == 'window.filmcraft'
          print('manifests valid')
          PY
